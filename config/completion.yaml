# VLM Reward RL Training - Completion Mode
# Binary yes/no task completion check per frame.
# VLM Model: LRM-completion (Qwen3-VL-8B fine-tuned)

defaults:
  - env/maniskill_put_on_plate_vlm@env.train
  - env/maniskill_put_on_plate_vlm@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "vlm_reward_completion"
    logger_backends: ["tensorboard"]

  max_epochs: 30
  max_steps: -1
  only_eval: False
  val_check_interval: 30
  save_interval: 30

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 2
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0.0005
  clip_ratio_high: 0.10
  clip_ratio_low: 0.10
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

  sampling_params:
    do_sample: False
    temperature_train: 0.2
    temperature_eval: 0.2
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    total_num_envs: 12
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    # Completion mode
    vlm_reward_type: completion
    vlm_completion_binary_reward: true
    vlm_call_interval: 5
    vlm_pure_reward: true
    vlm_non_call_reward_mode: hold
    vlm_require_connection: true
    vlm_reward_weight: 1.0
    vlm_reward_scale: 1.0
    init_params:
      use_multiple_plates: False
  eval:
    total_num_envs: 12
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/data/models/RLinf-Pi05-ManiSkill-25Main-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 24
  seed: 0
  enable_offload: True

  model:
    model_path: "/data/models/RLinf-Pi05-ManiSkill-25Main-SFT"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 5
    num_steps: 4
    openpi:
      value_after_vlm: False
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
    policy_setup: widowx_bridge

  optim:
    lr: 2.5e-6
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 0.3
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
