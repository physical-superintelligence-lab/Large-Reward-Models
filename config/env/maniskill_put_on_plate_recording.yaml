# Recording ManiSkill PutOnPlateInScene - for open-loop VLM reward evaluation
env_type: recording_maniskill

total_num_envs: null

auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1
use_fixed_reset_state_ids: True
max_steps_per_rollout_epoch: 80
max_episode_steps: 80

# Recording settings
record_trajectories: true
record_output_dir: ""   # override via command line
record_env_count: 80    # only record first 80 envs (out of 320)

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: PutOnPlateInScene25Main-v3
  num_envs: null
  obs_mode: "rgb+segmentation"
  control_mode: None
  sim_backend: "gpu"
  sim_config:
    sim_freq: 500
    control_freq: 5
  max_episode_steps: ${env.train.max_episode_steps}
  sensor_configs:
    shader_pack: "default"
  render_mode: all
  obj_set: train
  use_multiple_plates: False
